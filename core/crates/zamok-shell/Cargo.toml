[package]
name = "zamok-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Explorer extension: refuses to move an encrypted folder to another drive"

[lib]
name = "zamok_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
