[package]
name = "zamok-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zamok encrypted filesystem on WinFsp (Cryptomator format 8)"

[dependencies]
zamok-crypto = { path = "../zamok-crypto" }
thiserror = "2"
zeroize = "1"
anyhow = "1"
rpassword = "7"
winfsp = { version = "0.13.2", features = ["system", "windows-62", "notify"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[build-dependencies]
winfsp = { version = "0.13.2", features = ["delayload"] }

[dev-dependencies]
tempfile = "3"
