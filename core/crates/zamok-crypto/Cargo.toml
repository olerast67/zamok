[package]
name = "zamok-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cryptomator vault format 8 for Zamok: keys, names, file contents"

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Ключи раундов AES стираются при удалении: функция включается для всех, кто использует aes
aes = { version = "0.8", features = ["zeroize"] }
aes-siv = "0.7"
aes-kw = { version = "0.2", features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
subtle = "2"
crc32fast = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
