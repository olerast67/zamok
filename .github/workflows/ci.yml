name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install WinFsp (zamok-fs links against it)
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Programs used by tests/fs
        # Явно по имени: если исходник программы пропадёт из репозитория, шаг упадёт.
        run: cargo build -p zamok-fs --bin zamok-mount

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Zamok.exe
        run: dotnet build ui/Zamok.UI/Zamok.UI.csproj -c Release
      - name: Tests (without the ones that need a running zamok-core)
        run: dotnet test ui/Zamok.Tests/Zamok.Tests.csproj -c Release --filter "Category!=Integration"
