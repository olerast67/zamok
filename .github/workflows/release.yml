name: Release

# Сборка установщика на чистой машине GitHub. На тег v* создаётся черновик релиза с файлами
# и SHA256SUMS.txt; публикует его автор руками (RELEASING.md). Ручной запуск только собирает
# и кладёт файлы в артефакт сценария.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, numbers only (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Версию компилятора задаёт core/rust-toolchain.toml, rustup ставит её сам
      - name: Rust toolchain from core/rust-toolchain.toml
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install WinFsp (zamok-fs links against it)
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Version
        id: ver
        shell: pwsh
        run: |
          # Тег v0.1.0-alpha даёт версию 0.1.0: WiX принимает только числа
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' -replace '^v', '' -replace '-.*$', '' } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad version '$v'" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build-msi.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: Check SHA256SUMS.txt
        shell: bash
        working-directory: installer/out
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zamok-${{ steps.ver.outputs.version }}
          path: |
            installer/out/Zamok-Setup-${{ steps.ver.outputs.version }}.exe
            installer/out/Zamok-${{ steps.ver.outputs.version }}.msi
            installer/out/SHA256SUMS.txt
      - name: Draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" \
            --notes "Draft. Replace with the text from docs/PUBLISHING.md. SHA-256 of every file is in SHA256SUMS.txt." \
            "installer/out/Zamok-Setup-$v.exe" "installer/out/Zamok-$v.msi" installer/out/SHA256SUMS.txt
