[package]
name = "p2-shellext"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "P2 prototype: make 'open with password' the default verb of locked folders"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"

[workspace]
